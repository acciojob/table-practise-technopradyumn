<!DOCTYPE html>
<html>
<head>
    <title>Student Details Table</title>
    <style>
        table {
            background-color: yellow;
        }

        table, th, tr, td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <caption>Student Details</caption>
        <tr>
            <th>NAME</th>
            <th>AGE</th>
            <th>BRANCH</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>Aman</td>
            <td>21</td>
            <td>ECE</td>
        </tr>
    </table>
</body>
</html>
